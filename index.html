<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1 id="titulo">Fomulário</h1>
            <br>
            <hr>
            <br>
        </header>
        <section class="formulario">
            <form action="processar.php" method="post">
                <label for="nome" class="rotulo">Nome:</label>
                <input type="text" id="nome" name="nome"  class="form-control" required><br><br>
                <a class="link-help" href="help.html" target="_blank">help</a><br><br>

                <label for="nascimento" class="rotulo">Data de Nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" class="form-control" required><br><br>
                <a class="link-help" href="help.html" target="_blank">help</a><br><br>

                <label for="endereco" class="rotulo">Endereço:</label>
                <input type="text" id="endereco" name="endereco" class="form-control" required><br><br>
                <a class="link-help" href="help.html" target="_blank">help</a><br><br>

                <label for="numero" class="rotulo">Número:</label>
                <input type="text" id="numero" name="numero" class="form-control" required><br><br>
                <a class="link-help" href="help.html" target="_blank">help</a><br><br>

                <label for="cidade" class="rotulo">Cidade:</label>
                <input type="text" id="cidade" name="cidade" class="form-control" required><br><br>
                <a class="link-help" href="help.html" target="_blank">help</a><br><br>

                <label class="rotulo" for="estado">Estado:</label>
                <select id="estado" name="estado" class="form-control" required>
                    <option value="">Selecione</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="CE">Ceará</option>
                    <option value="PE">Pernambuco</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="PB">Paraíba</option>
                </select><br><br>
                <a class="link-help" href="help.html" target="_blank">help</a><br><br>

                <label for="sexo" class="rotulo">Sexo:</label>
                <select id="sexo" name="sexo" class="form-control" required>
                    <option value="">Selecione</option>
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                </select><br><br>
                <a class="link-help" href="help.html" target="_blank">help</a><br><br>

                <p class="rotulo">Possui bens:</p>
                <input type="checkbox" id="carro" name="bens" class="form-control" value="Carro">
                <label for="carro">Carro</label><br>
                <input type="checkbox" id="casa" name="bens" class="form-control" value="Casa">
                <label for="casa">Casa</label><br>
                <input type="checkbox" id="moto" name="bens" class="form-control" value="Moto">
                <label for="moto">Moto</label><br>
                           
                <a class="link-help" href="help.html" target="_blank">help</a><br><br>
                
                <textarea name="mensagem" rows="4" cols="50" class="form-control" placeholder="Experiências pessoais"></textarea><br><br>                  
                <input type="submit" value="Enviar" class="botao">
            </form>
        </section>


    </body>
